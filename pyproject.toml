[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-setup-engine"
version = "0.1.0"
description = "NSE next-day intraday setup discovery, ML ranking, and backtesting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "yfinance>=0.2.40",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nse-setup = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

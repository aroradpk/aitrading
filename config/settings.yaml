data_dir: data
offline_mode: true

thresholds:
  stock_1d_pct: 5.0
  stock_1w_pct: 10.0
  index_1d_pct: 2.0

universe:
  nifty_next_50_config: config/nifty_next_50.json
  active_count: 20
  yearly_trend_min_return_pct: 0.0

indices:
  - symbol: NIFTY_50
    yahoo: ^NSEI
    type: index
  - symbol: NIFTY_NEXT_50
    yahoo: SETFNN50.NS
    type: index
  - symbol: NIFTY_BANK
    yahoo: ^NSEBANK
    type: index

ohlcv:
  history_years: 5
  interval: 1d

conviction_weights:
  technical: 0.50
  fundamental: 0.25
  events: 0.15
  theme: 0.10

technical:
  timeframes:
    daily: 1d
    weekly: 1wk
  position_focus: long
  pattern_match_min_score: 0.45
  rsi_oversold: 35
  rsi_overbought: 65
  require_trend_for_setup: true

events:
  lookback_days: 30
  move_alignment_days: 3
  pib_feed_url: https://pib.gov.in/RssMain.aspx?ModId=6&Lang=2
  pib_cache_count: 100

fundamentals:
  screener_import_dir: data/fundamentals/import
  min_score_metrics: 2

backtest:
  conviction_min: 7.0
  signal_cooldown_days: 5
  forward_days_1d: 1
  forward_days_1w: 5
  stock_target_1d_pct: 5.0
  stock_target_1w_pct: 10.0
  index_target_1d_pct: 2.0
  tuning_conviction_min_grid: [6.0, 6.5, 7.0, 7.5, 8.0]
  tuning_cooldown_days_grid: [3, 5, 7, 10]
  tuning_conviction_floor: 6.0
  tuning_min_signals: 1

charts:
  enabled: true
  lookback_bars: 60

trusted_source_domains:
  - nseindia.com
  - bseindia.com
  - pib.gov.in
  - rbi.org.in
  - sebi.gov.in
